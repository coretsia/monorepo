name: Architecture / policy issue
description: Propose or report a problem with SSoT, gates, architecture rails, deterministic policy, or roadmap invariants.
title: "[Policy]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Coretsia architecture and policy issues.

        This includes SSoT drift, architectural ownership, dependency boundaries, public contracts, module composition, runtime lifecycles, configuration, tags, artifacts, determinism, observability, and tooling enforcement.

        Do not include secrets or sensitive diagnostic data. Report security vulnerabilities through the repository security policy, not public issues.

  - type: checkboxes
    id: existing-work
    attributes:
      label: Existing work
      options:
        - label: I have searched relevant issues, pull requests, ADRs, and SSoT docs.
          required: true

  - type: dropdown
    id: policy-area
    attributes:
      label: Policy area
      options:
        - SSoT / ADR / registry
        - Roadmap / architecture direction
        - Package ownership / dependency boundaries
        - Runtime / tooling boundaries
        - Public API / contracts / SPI
        - Module composition / dependency planning
        - Declarative DI / container policy
        - Runtime lifecycle / UnitOfWork / reset
        - Configuration / environment
        - Tags / discovery / ordering
        - Artifacts / schema policy
        - Determinism / rerun-no-diff
        - Observability / error handling
        - Security / redaction / disclosure
        - DTO policy
        - Release-line / package publishing
        - Gates / tooling / CI
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: current-policy
    attributes:
      label: Current policy or behavior
      description: Describe the current rule, behavior, or drift.
      placeholder: |
        Current rule:
        Current implementation:
        Current failure mode:
    validations:
      required: true

  - type: textarea
    id: proposed-policy
    attributes:
      label: Proposed policy or correction
      description: Describe the proposed invariant, its canonical owner, and how it should be enforced.
      placeholder: |
        Proposed rule:
        Reason:
        Canonical owner:
        Allowed and forbidden behavior:
        Enforcement:
    validations:
      required: true

  - type: textarea
    id: affected-sources
    attributes:
      label: Affected sources
      description: List affected docs, gates, packages, CI jobs, generated artifacts, or tests.
      placeholder: |
        - docs/ssot/...
        - docs/roadmap/...
        - tools/gates/...
        - packages/...
        - .github/workflows/ci.yml
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification strategy
      description: Describe how the invariant should be verified and how violations should be detected.
      placeholder: |
        - Normative documentation:
        - Existing enforcement mechanism:
        - Gate or architecture rule:
        - Positive and negative test cases:
        - CI verification:
        - Rerun-no-diff verification, if applicable:
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk and compatibility
      description: Describe architectural risks, compatibility implications, and potential enforcement gaps. Include migration needs only when required by the applicable release policy.
      placeholder: |
        Architectural risks:
        Compatibility impact:
        Migration requirements, if applicable:
        False positives:
        False negatives:
        Potential enforcement gaps:
    validations:
      required: true

  - type: checkboxes
    id: policy-checklist
    attributes:
      label: Policy checklist
      options:
        - label: I checked for overlap with existing architectural rules, gates, SSoT docs, and canonical mechanisms.
          required: true
        - label: I considered package ownership and dependency boundaries.
          required: true
        - label: I considered deterministic behavior, safe diagnostics, and failure semantics.
          required: true
        - label: I included concrete verification criteria and considered possible enforcement gaps.
          required: true

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Coretsia Code of Conduct.
          required: true
