name: Bug report
description: Report a reproducible defect in Coretsia.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects only.

        Include only minimal, sanitized reproduction evidence.

        Do not include secrets, credentials, tokens, private paths, raw production configuration, private environment values, raw production request data, or private customer data.

        Use synthetic or sanitized configuration, request data, headers, and other inputs when necessary to reproduce the issue.

        If this is a security vulnerability, do not open a public issue. Follow the repository security policy.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      description: Confirm that this is not already tracked.
      options:
        - label: I have searched existing issues and pull requests.
          required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the closest affected area.
      options:
        - Framework distribution / dependency management
        - Core contracts
        - DTO attribute / DTO policy
        - Foundation / Kernel
        - Platform CLI
        - HTTP / HttpApp / Routing
        - Errors / Problem Details
        - Logging / Metrics / Tracing
        - Redaction / data safety
        - Worker runtime
        - Runtime integrations
        - Tooling / gates / CI
        - Architecture / Deptrac
        - Package scaffold / compliance
        - Application template / presets
        - Documentation / SSoT
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe what happens now.
      placeholder: Describe the observed result, failure, or unexpected runtime behavior.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the expected behavior or invariant.
      placeholder: Describe the expected result, documented behavior, or violated invariant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest reproducible case using synthetic data and sanitized configuration where applicable. For intermittent defects, describe the triggering conditions and observed frequency.
      placeholder: |
        1. Install or check out the affected version.
        2. Prepare the minimal configuration or example.
        3. Execute the affected operation.
        4. Observe the unexpected behavior.

        Triggering conditions or observed frequency, if intermittent:
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands and sanitized diagnostic output
      description: Include relevant commands, safe error codes, HTTP status codes, or sanitized diagnostic output. Do not include raw sensitive data.
      render: text
      placeholder: |
        Command or operation:
        Error code or HTTP status:
        Sanitized output:
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant version and runtime details only. Do not include environment variable values or full environment dumps.
      placeholder: |
        - OS:
        - PHP version:
        - Composer version:
        - Git version, if relevant:
        - Coretsia version or commit:
        - Affected package versions:
        - Application target, if relevant:
        - Preset, if relevant:
        - Runtime driver, if relevant:
        - Source or compiled boot, if relevant:
    validations:
      required: true

  - type: textarea
    id: related-policy
    attributes:
      label: Related references
      description: Link relevant issues, ADRs, SSoT documents, roadmap entries, gates, package documentation, or public contracts if known.
      placeholder: |
        - docs/roadmap/...
        - docs/ssot/...
        - tools/gates/...
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed secrets, credentials, tokens, private paths, sensitive request data, and irrelevant environment details.
          required: true
        - label: I provided minimal reproduction steps and sanitized evidence of the observed behavior.
          required: true

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Coretsia Code of Conduct.
          required: true
