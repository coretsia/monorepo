name: Documentation issue
description: Report missing, stale, ambiguous, or inconsistent documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for documentation defects or documentation improvement requests.

        If the issue concerns documented commands, configuration, tags, artifacts, public contracts, runtime behavior, or architecture policies, include the relevant SSoT or ADR reference when known.

        Do not include secrets, private paths, or sensitive diagnostic data. Report security vulnerabilities through the repository security policy, not public issues.

  - type: checkboxes
    id: existing-work
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues and pull requests.
          required: true

  - type: dropdown
    id: docs-area
    attributes:
      label: Documentation area
      options:
        - SSoT
        - ADRs / architecture decisions
        - Roadmap
        - Commands / CLI reference
        - Configuration / environment
        - Public API / contracts
        - Runtime guides
        - Installation / dependency management
        - Development workflow
        - Architecture
        - Package documentation
        - Application template / skeleton distribution
        - Generated documentation / structure
        - README / contributing
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link or list the affected documentation path(s).
      placeholder: |
        - docs/guides/commands.md
        - docs/ssot/...
        - docs/roadmap/...
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: What is wrong, stale, missing, or ambiguous?
      placeholder: The document says..., but the current implementation/policy is...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected documentation
      description: Describe what should be corrected, clarified, or documented according to the canonical implementation and applicable documentation policy.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide references to implementation, tests, ADRs, SSoT docs, commands, or sanitized diagnostic evidence supporting the correction.
      placeholder: |
        - composer ...
        - composer.json
        - tools/gates/...
        - test output...
    validations:
      required: false

  - type: checkboxes
    id: docs-policy
    attributes:
      label: Documentation policy checklist
      options:
        - label: I considered whether this issue affects SSoT docs, ADRs, guides, public API references, the command catalog, or generated documentation.
          required: true
        - label: I considered whether the documentation accurately reflects the canonical implementation.
          required: true
        - label: I removed secrets, private paths, and sensitive or irrelevant environment details.
          required: true

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Coretsia Code of Conduct.
          required: true
