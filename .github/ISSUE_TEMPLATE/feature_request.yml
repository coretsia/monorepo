name: Feature request
description: Propose a new capability, package behavior, tool, gate, or public API.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose new capabilities or improvements to existing behavior.

        Coretsia is roadmap- and SSoT-driven. Describe the problem, desired behavior, scope, relevant invariants, and verifiable acceptance criteria.

        Do not include secrets or sensitive data. Report security vulnerabilities through the repository security policy, not public issues.

  - type: checkboxes
    id: existing-work
    attributes:
      label: Existing work
      options:
        - label: I have searched existing issues, pull requests, roadmap entries, and SSoT docs.
          required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      options:
        - Framework distribution / dependency management
        - Core contracts
        - DTO attribute / DTO policy
        - Foundation / Kernel
        - Platform CLI
        - HTTP / HttpApp / Routing
        - Errors / Problem Details
        - Logging / Metrics / Tracing
        - Redaction / data safety
        - Worker runtime
        - Runtime integrations
        - Tooling / gates / CI
        - Architecture / Deptrac
        - Package scaffold / compliance
        - Application template / presets
        - Documentation / SSoT
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: |
        Current limitation:
        Why it matters:
        Who is affected:
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, relevant invariants, and expected public contract. Include implementation details when known.
      placeholder: |
        Proposed behavior:
        Expected invariants:
        New or changed public APIs:
        New or changed entrypoints:
        New or changed configuration:
        New or changed tags:
        New or changed artifacts:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Define what is included and explicitly excluded.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: affected-files
    attributes:
      label: Expected affected areas
      description: List packages, docs, gates, tests, or generated artifacts likely to change.
      placeholder: |
        - packages/...
        - tools/gates/...
        - docs/ssot/...
        - docs/roadmap/...
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and public API
      description: Describe potential compatibility implications and migration needs when known. Migration and deprecation requirements depend on the applicable release policy.
      placeholder: |
        Affected public contracts:
        Expected compatibility impact:
        Migration or deprecation requirements, if applicable:
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable outcomes and verifiable criteria that would demonstrate the feature is complete and correct.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: policy
    attributes:
      label: Policy checklist
      options:
        - label: I considered whether SSoT docs need to change.
          required: true
        - label: I considered existing package responsibilities, dependency boundaries, and canonical mechanisms.
          required: true
        - label: I considered whether commands, config roots, tags, artifacts, gates, or public API policy need to change.
          required: true
        - label: I understand that roadmap alignment may be required before implementation.
          required: true

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Coretsia Code of Conduct.
          required: true
